<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera test · Empire of Clouds</title><style>body{margin:0;min-height:100dvh;background:#090909;color:#eee;font:14px/1.7 ui-monospace,monospace;padding:24px;box-sizing:border-box}h1{font-size:18px;letter-spacing:.08em}button{font:inherit;background:#eee;color:#000;border:0;padding:14px 18px;margin:12px 0}video{width:100%;max-height:45vh;object-fit:cover;background:#222}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a8e6c5}a{color:#a8e6c5}</style></head><body><h1>CAMERA DIAGNOSTIC / 01</h1><p>This page checks whether your browser can request the camera independently of the artwork.</p><pre id="info"></pre><button id="go">REQUEST CAMERA ACCESS</button><video id="v" playsinline muted autoplay></video><pre id="result">Tap REQUEST CAMERA ACCESS.</pre><p><a href="./">RETURN TO SPATIAL MATRIX</a></p><script>const info=document.getElementById('info'),out=document.getElementById('result'),v=document.getElementById('v');info.textContent='URL: '+location.href+'\nSecure context: '+isSecureContext+'\nCamera API: '+Boolean(navigator.mediaDevices?.getUserMedia)+'\nUser agent: '+navigator.userAgent;window.addEventListener('error',e=>out.textContent='JavaScript error: '+e.message);document.getElementById('go').onclick=async()=>{out.textContent='Requesting camera permission…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('getUserMedia is unavailable. Try external Safari/Chrome over HTTPS.');const s=await Promise.race([navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}}),new Promise((_,r)=>setTimeout(()=>r(new Error('Camera permission request timed out (15s)')),15000))]);v.srcObject=s;await v.play();out.textContent='SUCCESS: camera is playing. Return to the artwork.';}catch(e){out.textContent='FAILED: '+e.name+'\n'+e.message+'\nCheck camera permissions and open in Safari or Chrome, not an embedded preview.';}};</script></body></html>
